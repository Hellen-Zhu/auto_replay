projectName=oreo
#----------- REPORT CONFIG -----------
displayName=OREO Playwright
labels=FullRegression
report.traceability.release.name = OREO E2E POC
report.traceability.application.id=54982
report.traceability.project.code=54982
#----------- JDBC / SQL ENRICH CONFIG -----------
jdbc.default=composer
jdbc.composer.driver=org.postgresql.Driver
jdbc.composer.url=jdbc:postgresql://<db-host>:<db-port>/composer_dev?currentSchema=composer
jdbc.composer.username=<not committed>
jdbc.composer.password=

#----------- PLAYWRIGHT CONFIG -----------
playwright.browser=EDGE
playwright.headless=true
playwright.screenshot.on.failure=true
playwright.timeout=30000
# Trace mode is read through OreoModuleConfiguration; a JVM -D value overrides this file.
oreo.playwright.trace.mode=RETAIN_ON_FAILURE
# If omitted, PlaywrightTraceHooks defaults to RETAIN_ON_FAILURE. Override per run with:
# -Doreo.playwright.trace.mode=ON | RETAIN_ON_FAILURE | OFF
# The hook also accepts the compatibility override -Dplaywright.trace.mode=on|retain-on-failure|off.
# OreoModuleConfiguration descriptor: module name + `risk.engine.mode`.
oreo.risk.engine.mode=MOCK
#playwright.video.recording=true

# Element repository JSON files defining page element locators
playwright.element.path=classpath:elements/pages/*.json,classpath:elements/components/*.json
playwright.base.url=http://<oreo-host>:<web-port>/

# REST API base URL read by genie-rest RestModuleConfiguration.
rest.base.url=http://<oreo-host>:<api-port>/api/v1

report.ado.enabled = false
#report.ado.project = FMQPR
#report.ado.test-plan =
#report.ado.test-suite =
#report.ado.pat-token =
#report.ado.attachment.enabled = false
